<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="3D 태권도 선수가 6가지 배경에서 앞차기·옆차기·뒤차기로 판자, 용암 바위, 얼음, 기왓장, 수정, 산호를 격파하는 무한 순발력 게임">
<style>
/* page reset for standalone hosting */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px -apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif}
img{max-width:100%}
</style>
<title>태권 무한 격파 4D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
/* Layout: full-screen 3D dojo canvas; HUD strip floats on top, view chips + kick pad float at the bottom */
:root{
  --night:#0f1724;
  --panel:rgba(15,23,36,.72);
  --paper:#f3eee4;
  --muted:#9aa7bb;
  --gold:#f2c54e;
  --bad:#ef4a52;
  --hong:#c42f39;
  --life:#3fbf6a;
  --display:'Black Han Sans','Noto Sans KR',system-ui,sans-serif;
  --body:'Noto Sans KR',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--paper);font-family:var(--body);overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage.rot{cursor:move}

.top{position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px, env(safe-area-inset-right,0px)) 0 max(16px, env(safe-area-inset-left,0px))}
.top-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.hud{display:grid;grid-template-columns:1.4fr 1.1fr .9fr 1fr;gap:6px;padding:10px 12px;border-radius:14px;background:var(--panel);backdrop-filter:blur(6px)}
.stat{display:flex;flex-direction:column;gap:1px;min-width:0}
.stat .k{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.stat .v{font-family:var(--display);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.lives{display:flex;gap:4px;align-items:center;height:26px}
.lives b{width:13px;height:13px;flex:none;border-radius:50%;background:var(--life);box-shadow:0 0 0 2px rgba(255,255,255,.15), 0 0 10px rgba(63,191,106,.5)}
.lives em{font-style:normal;font-family:var(--display);font-size:22px;line-height:1;color:var(--life);font-variant-numeric:tabular-nums}
.lives.low em{color:var(--bad)}
.lives.low b{background:var(--bad);box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.pop .life{display:block;font-size:.6em;color:var(--life)}
.combo.hot .v{color:var(--gold)}
.meter{display:flex;flex-direction:column;gap:5px;padding:0 4px}
.track{height:6px;border-radius:3px;background:rgba(38,50,74,.85);overflow:hidden}
.track span{display:block;height:100%;width:0;background:var(--paper);transition:width .12s}
.timer span{width:100%;transform-origin:left;background:var(--gold)}
.meter .row{display:flex;justify-content:space-between;font-size:11px;color:#c4ccd8;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.6)}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;
  padding:0 max(16px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px, env(safe-area-inset-left,0px))}
.bottom-in{max-width:560px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.side{display:flex;flex-direction:column;gap:6px;pointer-events:auto;min-width:0}
.side.r{align-items:flex-end;text-align:right}
.chipbtn{font:inherit;font-size:12px;padding:7px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:var(--panel);color:var(--paper);cursor:pointer;white-space:nowrap;backdrop-filter:blur(6px)}
.chipbtn[aria-pressed="true"]{background:var(--paper);color:var(--night);font-weight:700}
.chipbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hint{font-size:11px;color:#c4ccd8;line-height:1.4;text-shadow:0 1px 2px rgba(0,0,0,.7);max-width:110px}

.pad{display:grid;grid-template-columns:repeat(3, var(--bs));grid-template-rows:repeat(3, var(--bs));gap:6px;--bs:clamp(48px, 13.5vw, 64px);pointer-events:auto;flex:none}
.btn{font:inherit;color:var(--paper);border:0;border-radius:14px;cursor:pointer;touch-action:manipulation;
  box-shadow:0 4px 0 rgba(5,9,16,.9), inset 0 1px 0 rgba(255,255,255,.15);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform .05s, box-shadow .05s}
.btn b{font-family:var(--display);font-size:clamp(17px,4.6vw,22px);font-weight:400;line-height:1}
.btn small{font-size:9px;opacity:.75;letter-spacing:.02em}
.btn.down,.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(5,9,16,.9)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn[data-dir="F"]{grid-area:1/2;background:linear-gradient(180deg,#9a2f38,#701f27)}
.btn[data-dir="L"]{grid-area:2/1;background:linear-gradient(180deg,#2f5ea8,#203f73)}
.btn[data-dir="R"]{grid-area:2/3;background:linear-gradient(180deg,#2f5ea8,#203f73)}
.btn[data-dir="B"]{grid-area:3/2;background:linear-gradient(180deg,#65522e,#40341d)}
.pad .hub{grid-area:2/2;border-radius:50%;margin:10px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}

.pops{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(20px,6vw,30px);color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 12px rgba(0,0,0,.4);white-space:nowrap;text-align:center;line-height:1.1}
.pop small{display:block;font-size:.55em;color:#fff}
.pop.bad{color:var(--bad)}
.swipe{position:absolute;width:64px;height:64px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid var(--gold);opacity:0}
.flash{position:fixed;inset:0;background:rgba(239,74,82,.25);pointer-events:none;z-index:3;opacity:0}
.lvl{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:4;pointer-events:none;font-family:var(--display);font-size:clamp(28px,8vw,40px);color:var(--paper);text-shadow:0 3px 12px rgba(0,0,0,.6);opacity:0;white-space:nowrap}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(9,14,23,.5);
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 20px)}
.overlay.clear{background:transparent;pointer-events:none}
.card{width:min(100%,420px);display:flex;flex-direction:column;gap:11px;text-align:center;max-height:100%;overflow:auto;padding:22px 20px;border-radius:20px;background:rgba(13,20,32,.86);backdrop-filter:blur(8px);box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.overlay.clear .card{background:transparent;box-shadow:none;backdrop-filter:none}
.card h1{font-family:var(--display);font-weight:400;font-size:clamp(39px,9vw,44px);line-height:1.05;margin:0;text-wrap:balance;word-break:keep-all}
.card h1 em{font-style:normal;color:var(--gold)}
.card h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,9vw,42px);margin:0;line-height:1.1;text-wrap:balance}
.card p{margin:0;color:#ccd3de;line-height:1.55;font-size:14px}
.kicks{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;text-align:left}
.kicks div{display:flex;flex-direction:column;gap:1px;padding:8px 11px;background:rgba(32,44,68,.8);border-radius:10px;font-size:12px;color:#c4ccd8}
.kicks strong{font-family:var(--display);font-weight:400;font-size:16px;color:var(--paper)}
.how{font-size:12px;color:#aeb8c8;line-height:1.5}
.toggles{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tg{font:inherit;font-size:13px;padding:7px 12px;border-radius:999px;border:1px solid #3a4763;background:transparent;color:var(--muted);cursor:pointer}
.tg[aria-pressed="true"]{background:var(--paper);color:var(--night);border-color:var(--paper);font-weight:700}
.tg:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.views{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.vw{font:inherit;font-size:12px;line-height:1.25;color:var(--paper);padding:7px 2px;min-height:44px;border-radius:10px;border:2px solid #34405a;background:rgba(32,44,68,.6);cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center}
.vw[aria-pressed="true"]{border-color:var(--gold);background:rgba(242,197,78,.14);font-weight:700}
.vw:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#customHint{text-align:left;line-height:1.4}
.preview canvas{touch-action:none;cursor:grab}
.go{font:inherit;font-family:var(--display);font-size:24px;padding:14px;border:0;border-radius:14px;background:var(--hong);color:#fff;cursor:pointer;box-shadow:0 5px 0 #7a1a21}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 #7a1a21}
.go:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.small{font-size:12px;color:var(--muted)}
.count{font-family:var(--display);font-size:96px;line-height:1;color:var(--gold);text-shadow:0 4px 16px rgba(0,0,0,.5)}
.results{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.results div{background:rgba(32,44,68,.8);border-radius:10px;padding:10px 4px;display:flex;flex-direction:column;gap:2px}
.results .k{font-size:11px;color:var(--muted)}
.results .v{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.err{color:var(--bad)}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick{font:inherit;color:var(--paper);display:flex;flex-direction:column;gap:2px;padding:9px 10px;border-radius:12px;border:2px solid #34405a;background:rgba(32,44,68,.6);cursor:pointer}
.pick b{font-family:var(--display);font-weight:400;font-size:18px}
.preview{height:clamp(170px,30svh,240px);border-radius:14px;overflow:hidden;background:#18233a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);flex:none}
.preview canvas{display:block;width:100%;height:100%}
.opt{display:flex;align-items:center;gap:10px;text-align:left}
.opt.col{flex-direction:column;align-items:stretch;gap:6px}
.lab{font-size:12px;color:var(--muted);letter-spacing:.06em;flex:none;min-width:44px}
.sws{display:flex;gap:6px;flex:1}
.sw{flex:1;font:inherit;font-size:13px;color:var(--paper);display:flex;align-items:center;justify-content:center;gap:7px;padding:8px;border-radius:10px;border:2px solid #34405a;background:rgba(32,44,68,.6);cursor:pointer}
.sw i{width:16px;height:16px;border-radius:4px;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.sw i.w{background:#f6f5f1}.sw i.b{background:#1b1c20}
.sw i.dojo{background:linear-gradient(#2152a3 0 70%,#c42f39 70%)}
.sw i.lava{background:radial-gradient(circle at 40% 40%,#ffd36b,#ff5a12 45%,#3a0a02 80%)}
.sw i.ice{background:linear-gradient(135deg,#e8f8ff,#7cc8ee 55%,#1b4a6b)}
.sw i.palace{background:linear-gradient(#a9c4dc 0 45%,#3a3f44 45% 62%,#8e2a1f 62% 82%,#b8b2a6 82%)}
.sw i.storm{background:linear-gradient(160deg,#2a2c44,#0c0e1b);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),inset -5px 4px 0 -3px #c9b8ff}
.sw i.sea{background:linear-gradient(#5fd0e6,#0a4a5c 60%,#c9b78e 60%)}
.stgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.stgs .sw{padding:7px 4px;font-size:12px;gap:5px;min-width:0;white-space:nowrap}
.sw[aria-pressed="true"]{border-color:var(--gold);background:rgba(242,197,78,.12)}
.hairs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.hair{font:inherit;color:var(--paper);padding:3px 2px 4px;border-radius:10px;border:2px solid #34405a;background:rgba(32,44,68,.6);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.hair img{display:block;width:100%;aspect-ratio:1;border-radius:7px;max-width:100%}
.hair span{font-size:10px;line-height:1.1;white-space:nowrap;letter-spacing:-.02em}
.hair[aria-pressed="true"]{border-color:var(--gold);background:rgba(242,197,78,.14)}
.sw:focus-visible,.hair:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pick[aria-pressed="true"]{border-color:var(--gold);background:rgba(242,197,78,.12)}
.pick:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>

<canvas id="stage" aria-label="3D 격파 경기장"></canvas>
<div class="flash" id="flash"></div>
<div class="pops" id="pops"></div>
<div class="lvl" id="lvl"></div>

<div class="top">
  <div class="top-in">
    <div class="hud">
      <div class="stat"><span class="k">점수</span><span class="v" id="hScore">0</span></div>
      <div class="stat"><span class="k">시간</span><span class="v" id="hTime">0:00</span></div>
      <div class="stat combo" id="hComboWrap"><span class="k">콤보</span><span class="v" id="hCombo">0</span></div>
      <div class="stat"><span class="k">기회</span><div class="lives" id="hLives"><b></b><em id="hLifeN">5</em></div></div>
    </div>
    <div class="meter">
      <div class="track timer"><span id="timerBar"></span></div>
      <div class="track"><span id="lvlBar"></span></div>
      <div class="row"><span id="lvlText">속도 Lv.1</span><span id="boardText">격파 0장</span></div>
    </div>
  </div>
</div>

<div class="bottom">
  <div class="bottom-in">
    <div class="side">
      <button class="chipbtn" id="viewBtn" type="button">시점: 비스듬히</button>
      <button class="chipbtn" id="modeBtn" type="button" aria-pressed="false">드래그: 발차기</button>
    </div>
    <div class="pad" id="pad">
      <button class="btn" id="bF" data-dir="F" type="button"><b>앞</b><small>앞차기</small></button>
      <button class="btn" id="bL" data-dir="L" type="button"><b>좌</b><small>옆차기</small></button>
      <div class="hub"></div>
      <button class="btn" id="bR" data-dir="R" type="button"><b>우</b><small>옆차기</small></button>
      <button class="btn" id="bB" data-dir="B" type="button"><b>뒤</b><small>뒤차기</small></button>
    </div>
    <div class="side r"><span class="hint" id="hint">판자 쪽으로 드래그하면 발차기</span></div>
  </div>
</div>

<div class="overlay" id="ovStart">
  <div class="card">
    <h1>태권 무한 격파 <em>4D</em></h1>
    <p class="err" id="startMsg" hidden></p>
    <div class="preview"><canvas id="preview" aria-label="내 선수 미리보기"></canvas></div>
    <div class="picks" role="group" aria-label="선수 선택">
      <button class="pick" type="button" data-kind="m" aria-pressed="true"><b>남자 선수</b></button>
      <button class="pick" type="button" data-kind="f" aria-pressed="false"><b>여자 선수</b></button>
    </div>
    <div class="opt">
      <span class="lab">도복</span>
      <div class="sws" role="group" aria-label="도복 색깔">
        <button class="sw" type="button" data-dobok="w" aria-pressed="true"><i class="w"></i>흰색</button>
        <button class="sw" type="button" data-dobok="b" aria-pressed="false"><i class="b"></i>검은색</button>
      </div>
    </div>
    <div class="opt col">
      <span class="lab">배경</span>
      <div class="stgs" role="group" aria-label="배경">
        <button class="sw" type="button" data-stage="dojo" aria-pressed="true"><i class="dojo"></i>도장</button>
        <button class="sw" type="button" data-stage="lava" aria-pressed="false"><i class="lava"></i>용암 지대</button>
        <button class="sw" type="button" data-stage="ice" aria-pressed="false"><i class="ice"></i>얼음 동굴</button>
        <button class="sw" type="button" data-stage="palace" aria-pressed="false"><i class="palace"></i>경복궁</button>
        <button class="sw" type="button" data-stage="storm" aria-pressed="false"><i class="storm"></i>번개 산</button>
        <button class="sw" type="button" data-stage="sea" aria-pressed="false"><i class="sea"></i>바닷속</button>
      </div>
    </div>
    <div class="opt col">
      <span class="lab">머리 스타일</span>
      <div class="hairs" id="hairs" role="group" aria-label="머리 스타일"></div>
    </div>
    <div class="toggles" aria-label="4D 효과">
      <button class="tg" id="tgSound" type="button" aria-pressed="true">소리</button>
      <button class="tg" id="tgVib" type="button" aria-pressed="true">진동</button>
      <button class="tg" id="tgShake" type="button" aria-pressed="true">화면 흔들림</button>
    </div>
    <div class="opt col">
      <span class="lab">게임 시점</span>
      <div class="views" role="group" aria-label="게임 시점">
        <button class="vw" type="button" data-view="0" aria-pressed="false">왼쪽<br>비스듬히</button>
        <button class="vw" type="button" data-view="1" aria-pressed="true">오른쪽<br>비스듬히</button>
        <button class="vw" type="button" data-view="2" aria-pressed="false">위쪽</button>
        <button class="vw" type="button" data-view="6" aria-pressed="false">직접<br>선택</button>
      </div>
      <span class="small" id="customHint" hidden>위 미리보기 화면을 드래그해 각도를 맞추세요. 두 손가락(마우스 휠)으로 거리 조절.</span>
    </div>
    <button class="go" id="startBtn" type="button">시작</button>
    <span class="small" id="bestText">최고 기록 0점</span>
  </div>
</div>

<div class="overlay clear" id="ovIntro" hidden>
  <div class="card"><div class="count" id="introCount">3</div></div>
</div>

<div class="overlay" id="ovEnd" hidden>
  <div class="card">
    <h2 id="endTitle">경기 종료</h2>
    <p id="endDesc"></p>
    <div class="results">
      <div><span class="k">점수</span><span class="v" id="rScore">0</span></div>
      <div><span class="k">버틴 시간</span><span class="v" id="rTime">0:00</span></div>
      <div><span class="k">격파</span><span class="v" id="rBoards">0</span></div>
      <div><span class="k">최대 콤보</span><span class="v" id="rCombo">0</span></div>
    </div>
    <button class="go" id="againBtn" type="button">다시 도전</button>
    <button class="tg" id="changeBtn" type="button">나가기</button>
    <span class="small" id="endBest"></span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  if(!window.THREE){ $('startMsg').textContent = '3D 엔진을 불러오지 못했습니다. 페이지를 새로고침해 주세요.'; $('startMsg').hidden = false; return; }

  // ================= GAME DATA =================
  const DIRS = ['F','B','L','R'];
  const KICK_NAME = {F:'앞차기', B:'뒤차기', L:'옆차기', R:'옆차기'};
  const DIRV = {F:[0,-1], B:[0,1], L:[-1,0], R:[1,0]};
  const VIEWS = [
    {name:'왼쪽 비스듬히',   yaw:-.7,     pitch:.42, dist:5.8},
    {name:'오른쪽 비스듬히', yaw:.7,      pitch:.42, dist:5.8},
    {name:'위쪽',           yaw:0,       pitch:1.22, dist:6.6},
    {name:'뒤에서',          yaw:0,       pitch:.32, dist:5.8},
    {name:'옆에서',          yaw:1.45,    pitch:.16, dist:5.8},
    {name:'앞에서',          yaw:Math.PI, pitch:.2,  dist:5.8}
  ];
  VIEWS.push({name:'직접 선택', yaw:.35, pitch:.5, dist:5.8, custom:true});
  const CUSTOM = VIEWS.length - 1;
  const PRE_VIEWS = [0, 1, 2, CUSTOM];   // choices on the start screen
  try { const c = JSON.parse(localStorage.getItem('tkd-view-custom') || 'null'); if(c && isFinite(c.yaw) && isFinite(c.pitch) && isFinite(c.dist)) Object.assign(VIEWS[CUSTOM], {yaw:c.yaw, pitch:c.pitch, dist:c.dist}); } catch(e){}
  const BOARD_DIST = 1.02, BOARD_H = .95;
  const PER_LEVEL = 8;
  const fx = {sound:true, vib:true, shake:true};
  // Lv.1 = 2.00s per board, each level 0.08s faster, last level (Lv.25) = 0.10s
  const START_MS = 2000, STEP_MS = 80, MIN_MS = 100;
  const MAX_LV = Math.ceil((START_MS - MIN_MS) / STEP_MS) + 1;
  const levelOf = n => Math.min(MAX_LV, Math.floor(n / PER_LEVEL) + 1);
  const limitFor = n => Math.max(MIN_MS, START_MS - STEP_MS * (levelOf(n) - 1));

  // ================= THREE SETUP =================
  const canvas = $('stage');

  try { renderer = new THREE.WebGLRenderer({canvas, antialias:true}); }
  catch(e){ $('startMsg').textContent = '이 기기에서는 3D(WebGL)를 사용할 수 없습니다.'; $('startMsg').hidden = false; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.shadowMap.enabled = true;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0f1724);
  scene.fog = new THREE.Fog(0x0f1724, 9, 22);
  const camera = new THREE.PerspectiveCamera(50, 1, .1, 60);

  const hemi = new THREE.HemisphereLight(0xe6edff, 0x1c2436, .8); scene.add(hemi);
  const key = new THREE.DirectionalLight(0xfff1de, 1.35);
  key.position.set(2.5, 7, 4); key.castShadow = true;
  const big = Math.min(window.innerWidth, window.innerHeight) > 600;
  key.shadow.mapSize.set(big?2048:1024, big?2048:1024);
  Object.assign(key.shadow.camera, {left:-3,right:3,top:3,bottom:-3,near:1,far:20});
  key.shadow.bias = -.0004; key.shadow.normalBias = .02;

  const rim = new THREE.DirectionalLight(0x8fb0ff, .8); rim.position.set(-4, 3.5, -5); scene.add(rim);
  const fill = new THREE.DirectionalLight(0xffe2c8, .35); fill.position.set(-3, 2, 4); scene.add(fill);

  // ---- canvas textures ----
  function canvasTex(w, h, draw, srgb=true){
    const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); if(srgb) t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t;
  }
  const matTex = canvasTex(1024,1024,(g)=>{
    g.fillStyle = '#c42f39'; g.fillRect(0,0,1024,1024);
    const m = 96; g.fillStyle = '#2152a3'; g.fillRect(m,m,1024-2*m,1024-2*m);
    g.strokeStyle = 'rgba(255,255,255,.09)'; g.lineWidth = 3;
    const step = (1024-2*m)/8;
    for(let i=0;i<=8;i++){ g.beginPath(); g.moveTo(m+i*step,m); g.lineTo(m+i*step,1024-m); g.stroke(); g.beginPath(); g.moveTo(m,m+i*step); g.lineTo(1024-m,m+i*step); g.stroke(); }
    g.strokeStyle = 'rgba(255,255,255,.3)'; g.lineWidth = 6; g.beginPath(); g.arc(512,512,70,0,Math.PI*2); g.stroke();
  });
  const woodTex = canvasTex(256,128,(g)=>{
    g.fillStyle = '#d8a467'; g.fillRect(0,0,256,128);
    for(let i=0;i<34;i++){ const y = Math.random()*128; g.strokeStyle = `rgba(${120+Math.random()*30|0},${70+Math.random()*30|0},30,${.15+Math.random()*.3})`;
      g.lineWidth = .6+Math.random()*2; g.beginPath(); g.moveTo(0,y);
      for(let x=0;x<=256;x+=16) g.lineTo(x, y + Math.sin(x*.03 + i)*2.5); g.stroke(); }
  });
  // cotton weave bump for the dobok
  const weave = canvasTex(256,256,(g,w,h)=>{
    g.fillStyle = '#808080'; g.fillRect(0,0,w,h);
    for(let y=0;y<h;y+=2){ g.fillStyle = `rgba(255,255,255,${.06+Math.random()*.08})`; g.fillRect(0,y,w,1); }
    for(let x=0;x<w;x+=2){ g.fillStyle = `rgba(0,0,0,${.05+Math.random()*.07})`; g.fillRect(x,0,1,h); }
    for(let i=0;i<1400;i++){ g.fillStyle = `rgba(${Math.random()<.5?0:255},${Math.random()<.5?0:255},${Math.random()<.5?0:255},.05)`; g.fillRect(Math.random()*w, Math.random()*h, 2, 1); }
  }, false);
  weave.wrapS = weave.wrapT = THREE.RepeatWrapping; weave.repeat.set(6,6);
  // black belt: stitched rows along the length
  const beltTex = canvasTex(512,64,(g,w,h)=>{
    g.fillStyle = '#121212'; g.fillRect(0,0,w,h);
    g.strokeStyle = 'rgba(255,255,255,.09)'; g.lineWidth = 1.2;
    for(let y=6;y<h;y+=7){ g.setLineDash([3,2]); g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); }
  });
  beltTex.wrapS = beltTex.wrapT = THREE.RepeatWrapping;

  // ---- floor ----
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(10,10), new THREE.MeshStandardMaterial({map:matTex, roughness:.85}));
  floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
  const under = new THREE.Mesh(new THREE.PlaneGeometry(60,60), new THREE.MeshStandardMaterial({color:0x1a2333, roughness:1}));
  under.rotation.x = -Math.PI/2; under.position.y = -.01; scene.add(under);

  // ================= ATHLETE =================
  const M = {
    dobok: new THREE.MeshStandardMaterial({color:0xf6f5f1, roughness:.92, bumpMap:weave, bumpScale:.0025}),
    collar:new THREE.MeshStandardMaterial({color:0x141414, roughness:.75}),
    skin:  new THREE.MeshStandardMaterial({color:0xd6a07c, roughness:.55}),
    lip:   new THREE.MeshStandardMaterial({color:0xb4776a, roughness:.5}),
    hair:  new THREE.MeshStandardMaterial({color:0x14100d, roughness:.55}),
    belt:  new THREE.MeshStandardMaterial({color:0xffffff, map:beltTex, roughness:.7}),
    gold:  new THREE.MeshStandardMaterial({color:0xd4a63a, roughness:.35, metalness:.6}),
    eyeW:  new THREE.MeshStandardMaterial({color:0xf2efe8, roughness:.3}),
    eyeD:  new THREE.MeshStandardMaterial({color:0x1b130e, roughness:.2})
  };
  function mesh(geo, mat, x=0,y=0,z=0){ const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true; return m; }
  function taper(r1, r2, len, mat, seg=18){ const g = new THREE.CylinderGeometry(r1, r2, len, seg); g.translate(0, -len/2, 0); return mesh(g, mat); }
  function ell(rx, ry, rz, mat, x=0,y=0,z=0, seg=20){ const m = mesh(new THREE.SphereGeometry(1, seg, Math.round(seg*.75)), mat, x,y,z); m.scale.set(rx,ry,rz); return m; }
  function lathe(pts, mat, sz){ const g = new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])), 28); const m = mesh(g, mat); m.scale.z = sz; return m; }
  function band(from, to, w, t, mat){ // thin strip between two points
    const a = new THREE.Vector3(...from), b = new THREE.Vector3(...to);
    const len = a.distanceTo(b);
    const m = mesh(new THREE.BoxGeometry(w, len, t), mat);
    m.position.copy(a).add(b).multiplyScalar(.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), b.clone().sub(a).normalize());
    return m;
  }

  // kind: 'm' = male athlete, 'f' = female athlete. Hair is a separate, swappable group.
  function buildAthlete(kind){
    const F = kind === 'f';
    const skin = new THREE.MeshStandardMaterial({color: F ? 0xe6b896 : 0xd29c78, roughness:.55});
    const hairM = new THREE.MeshStandardMaterial({color: F ? 0x160e0a : 0x0b0908, roughness:.45});
    const lipM = new THREE.MeshStandardMaterial({color: F ? 0xd0737a : 0xb4776a, roughness:.45});
    const W = F ? .9 : 1;           // shoulder / chest width factor

    const root = new THREE.Group(); scene.add(root);
    if(F) root.scale.setScalar(.94);
    const hips = new THREE.Group(); hips.position.y = .96; root.add(hips);
    hips.add(ell(F?.168:.165,.11,.12, M.dobok, 0,-.04,0));

    const spine = new THREE.Group(); hips.add(spine);
    const torsoPts = [[0,0],[.15,0],[.152,.08],[.162,.19],[.182,.31],[.192,.41],[.18,.49],[.14,.555],[.07,.59],[0,.595]]
      .map(([r,y],i)=>[ i>2 ? r*W : r*(F?.97:1), y ]);
    spine.add(lathe(torsoPts, M.dobok, .66));
    spine.add(lathe([[.153,.02],[.168,-.07],[.18,-.16],[.177,-.165]], M.dobok, .7));
    spine.add(band([-.075*W,.575,-.072],[.035,.24,-.124], .034, .012, M.collar));
    spine.add(band([.075*W,.575,-.072],[-.012,.31,-.122], .034, .012, M.collar));
    const backCollar = mesh(new THREE.TorusGeometry(.08, .016, 8, 20, Math.PI), M.collar, 0,.575,-.005); backCollar.rotation.x = -Math.PI/2 - .25; backCollar.scale.set(W,.85,1); spine.add(backCollar);
    spine.add(ell(.038,.048,.02, skin, 0,.545,-.08));
    // dobok prints, as on the reference photos: vertical "태권" on the wearer's left chest, badge under the V
    decal(spine, M.print, .056, .1, [-.085*W, .335, -.109*W], Math.PI + .45);
    decal(spine, M.badge, .03, .02, [0, .232, -.129], Math.PI);

    // black belt
    const beltY = .045;
    const beltBand = mesh(new THREE.CylinderGeometry(.158,.158,.048,32,1,true), M.belt, 0,beltY,0); beltBand.scale.z = .69; spine.add(beltBand);
    const knot = mesh(new THREE.BoxGeometry(.075,.055,.035), M.belt, 0,beltY,-.112); knot.rotation.z = .08; spine.add(knot);
    const tails = new THREE.Group(); tails.position.set(0,beltY-.02,-.118); spine.add(tails);
    function tail(sx, rz){ const g = new THREE.Group(); g.rotation.z = rz; tails.add(g);
      g.add(mesh(new THREE.BoxGeometry(.042,.36,.009), M.belt, sx,-.18,0));
      g.add(mesh(new THREE.BoxGeometry(.03,.06,.002), M.gold, sx,-.3,-.006)); return g; }
    const tailL = tail(-.018, .1), tailR = tail(.018, -.14);

    // neck + head (face only; hair is added by setHair)
    const neck = new THREE.Group(); neck.position.y = .58; spine.add(neck);
    const nk = taper(F?.046:.052, F?.05:.058, .09, skin); nk.position.y = .08; neck.add(nk);
    const head = new THREE.Group(); head.position.y = .1; neck.add(head);
    if(F) head.scale.setScalar(1.04);
    head.add(ell(.088, F?.104:.108, F?.098:.1, skin, 0,.075,.005, 28));
    head.add(ell(F?.064:.07, F?.054:.06, F?.07:.075, skin, 0,F?.026:.02,-.018, 24));
    head.add(ell(F?.024:.03, .022, .026, skin, 0,F?-.01:-.02,-.058));
    const nose = mesh(new THREE.ConeGeometry(F?.011:.014, F?.03:.04, 10), skin, 0,.055,F?-.097:-.1); nose.rotation.x = -Math.PI/2 + .35; head.add(nose);
    head.add(ell(.013,.021,.01, skin, -.087,.065,.01), ell(.013,.021,.01, skin, .087,.065,.01));
    [-1,1].forEach(s=>{
      const ex = s*(F?.035:.033), ey = F?.078:.082;
      head.add(ell(F?.018:.014, F?.013:.008, .006, M.eyeW, ex,ey,-.088));
      head.add(ell(F?.009:.006, F?.010:.006, .004, M.eyeD, ex,ey,-.093));
      if(F){
        head.add(ell(.003,.003,.002, M.eyeW, ex+s*.003,ey+.004,-.097));
        const lash = mesh(new THREE.BoxGeometry(.04,.005,.006), hairM, ex,ey+.013,-.091); lash.rotation.z = s*-.15; head.add(lash);
        const blush = ell(.018,.01,.004, M.blush, s*.05,.045,-.083); blush.castShadow = false; head.add(blush);
      }
      const brow = mesh(new THREE.BoxGeometry(F?.028:.03, F?.005:.007, .008), hairM, s*.035, F?.104:.1, -.09); brow.rotation.z = s*(F?-.2:-.12); head.add(brow);
    });
    head.add(ell(F?.017:.022, F?.006:.005, .006, lipM, 0,F?.022:.018,-.084));

    function makeArm(s){
      const sh = new THREE.Group(); sh.position.set(s*.2*W,.5,0); spine.add(sh);
      sh.add(ell(.075*(F?.9:1),.07,.07, M.dobok));
      sh.add(taper(F?.062:.068, F?.057:.062, F?.28:.3, M.dobok));
      const el = new THREE.Group(); el.position.y = F?-.27:-.29; sh.add(el);
      el.add(ell(.055,.052,.055, M.dobok));
      el.add(taper(F?.056:.06, F?.06:.064, .2, M.dobok));
      const wr = taper(F?.028:.032, F?.026:.03, .06, skin); wr.position.y = -.19; el.add(wr);
      const hand = new THREE.Group(); hand.position.y = -.25; el.add(hand);
      hand.add(ell(F?.035:.04, F?.043:.048, F?.045:.05, skin, 0,-.01,0));
      hand.add(ell(.015,.028,.017, skin, s*-.03,-.005,-.02));
      return {sh, el, hand};
    }
    function makeLeg(s){
      const hip = new THREE.Group(); hip.position.set(s*.095,-.05,0); hips.add(hip);
      hip.add(taper(.1,.082,.45,M.dobok));
      const kn = new THREE.Group(); kn.position.y = -.44; hip.add(kn);
      kn.add(ell(.078,.07,.078, M.dobok));
      kn.add(taper(.08,.084,.38,M.dobok));
      const an = taper(F?.035:.04, F?.032:.036, .06, skin); an.position.y = -.37; kn.add(an);
      const ft = new THREE.Group(); ft.position.y = -.43; kn.add(ft);
      const k = F ? .9 : 1;
      ft.add(ell(.045*k,.032,.065*k, skin, 0,-.01,0));
      ft.add(ell(.048*k,.026,.07*k, skin, 0,-.02,-.075*k));
      ft.add(ell(.042*k,.017,.03*k, skin, 0,-.028,-.14*k));
      return {hip, kn, ft};
    }
    const armL = makeArm(-1), armR = makeArm(1);
    const legL = makeLeg(-1), legR = makeLeg(1);
    decal(armL.sh, M.flag, .05, .034, [-.064, -.085, -.03], -2.02);
    decal(legL.hip, M.print, .06, .11, [-.045, -.25, -.084], Math.PI + .5);
    return {kind, root, hips, spine, neck, head, armL, armR, legL, legR, tails, tailL, tailR, hairM, hairG:null, pigs:[]};
  }

  // ---------- hairstyles ----------
  const HAIRS = [
    {id:'perm',   name:'파마'},
    {id:'long',   name:'긴머리'},
    {id:'short',  name:'짧은 머리'},
    {id:'twin',   name:'양갈래'},
    {id:'pony',   name:'한갈래'},
    {id:'shaggy', name:'샤기컷'}
  ];
  const HC = new THREE.Vector3(0,.08,.012);              // cranium centre in head space
  const isFace = v => v.z < -.035 && v.y < .118;          // keep hair off the face
  function hairCap(g, hm){ const cap = mesh(new THREE.SphereGeometry(.096,28,20,0,Math.PI*2,0,Math.PI*.52), hm, 0,.088,.012); cap.scale.set(.98,1,1.06); cap.rotation.x = .22; g.add(cap); }
  function hairVolume(g, hm, k=1){ g.add(ell(.093*k,.085*k,.095*k, hm, 0,.07,.025)); }
  function bangs(g, hm, ragged){
    for(let i=-3;i<=3;i++){
      const len = ragged ? .028 + ((i*7+9)%4)*.008 : .032;
      const b = ell(.022, len, .014, hm, i*.022, .134 - Math.abs(i)*.004 - (ragged?len*.4:0), -.078 + Math.abs(i)*.008);
      b.rotation.z = i*.12; b.rotation.x = -.35; g.add(b);
    }
  }
  function sideLocks(g, hm, len=.06){ [-1,1].forEach(s=> g.add(ell(.02,len,.025, hm, s*.08,.1-len,-.03))); }
  function tie(g){ const t = mesh(new THREE.TorusGeometry(.018,.008,8,16), M.tie); return t; }

  function buildHair(style, hm){
    const g = new THREE.Group(), pigs = [];
    if(style === 'short'){
      hairCap(g, hm); g.add(ell(.088,.05,.09, hm, 0,.06,.035));
      g.add(ell(.078,.04,.082, hm, 0,.158,.0));            // textured volume on top
      for(let i=0;i<5;i++){                                 // fringe swept toward the wearer's right
        const f = ell(.03,.016,.03, hm, .045 - i*.024, .143 - i*.006, -.068 + Math.abs(i-2)*.004);
        f.rotation.set(-.45, 0, -.35); g.add(f);
      }
      [-1,1].forEach(s=> g.add(ell(.012,.026,.016, hm, s*.086,.058,-.012)));   // sideburns
    }
    else if(style === 'perm'){
      hairVolume(g, hm, 1.05);
      const curl = new THREE.SphereGeometry(1,10,8), v = new THREE.Vector3();
      for(let ph=.15; ph<2.15; ph+=.26){
        const ring = Math.max(1, Math.round(Math.sin(ph)*16));
        for(let k=0;k<ring;k++){
          const th = k/ring*Math.PI*2 + ph*1.7;
          v.set(Math.sin(ph)*Math.sin(th), Math.cos(ph), -Math.sin(ph)*Math.cos(th)).multiplyScalar(.1).add(HC);
          if(isFace(v)) continue;
          const c = mesh(curl, hm, v.x, v.y, v.z); c.scale.setScalar(.026 + ((k*13+ph*10)%3)*.004); g.add(c);
        }
      }
    }
    else if(style === 'long'){
      hairCap(g, hm); hairVolume(g, hm); bangs(g, hm);
      sideLocks(g, hm, .13);
      const back = new THREE.Group(); back.position.set(0,.11,.05); g.add(back);
      back.add(ell(.088,.2,.045, hm, 0,-.14,.035));
      back.add(ell(.07,.06,.035, hm, 0,-.33,.04));
      pigs.push({g:back, mode:'sheet'});
    }
    else if(style === 'twin'){
      hairCap(g, hm); hairVolume(g, hm); bangs(g, hm); sideLocks(g, hm);
      [-1,1].forEach(s=>{
        const pig = new THREE.Group(); pig.position.set(s*.085,.11,.03); g.add(pig);
        const t = tie(); t.rotation.y = Math.PI/2; pig.add(t);
        pig.add(ell(.012,.012,.012, M.tie, s*.004,.004,-.018));
        [[.032,.05,.032,-.04],[.034,.06,.034,-.1],[.028,.055,.028,-.16],[.018,.04,.018,-.21]]
          .forEach(([rx,ry,rz,y])=> pig.add(ell(rx,ry,rz, hm, s*.012, y, .012)));
        pigs.push({g:pig, mode:'pig', s});
      });
    }
    else if(style === 'pony'){
      hairCap(g, hm); hairVolume(g, hm, .98);
      for(let i=0;i<5;i++){                                 // bangs parted and swept to one side
        const b = ell(.026,.03,.014, hm, .05 - i*.026, .13 - i*.01, -.075 + Math.abs(i-2)*.006);
        b.rotation.set(-.35, 0, -.5 + i*.05); g.add(b);
      }
      [-1,1].forEach(s=>{ const l = ell(.011,.085,.014, hm, s*.075,.02,-.05); l.rotation.z = s*.08; g.add(l); });  // face-framing strands
      const pony = new THREE.Group(); pony.position.set(0,.165,.075); g.add(pony);
      const t = mesh(new THREE.TorusGeometry(.017,.007,8,16), M.tieDark); t.rotation.x = Math.PI/2 - .6; pony.add(t);
      [[.03,.04,.03,-.01,.03],[.036,.07,.034,-.08,.06],[.034,.08,.03,-.18,.075],[.028,.075,.024,-.28,.08],[.016,.05,.014,-.36,.08]]
        .forEach(([rx,ry,rz,y,z])=> pony.add(ell(rx,ry,rz, hm, 0, y, z)));
      pigs.push({g:pony, mode:'tail'});
    }
    else if(style === 'shaggy'){
      hairCap(g, hm); hairVolume(g, hm, 1.03); bangs(g, hm, true);
      const spike = new THREE.SphereGeometry(1,8,6), v = new THREE.Vector3(), d = new THREE.Vector3(), up = new THREE.Vector3(0,1,0);
      for(let ph=.35; ph<1.95; ph+=.3){
        const ring = Math.round(Math.sin(ph)*12);
        for(let k=0;k<ring;k++){
          const th = k/ring*Math.PI*2 + ph;
          d.set(Math.sin(ph)*Math.sin(th), Math.cos(ph), -Math.sin(ph)*Math.cos(th));
          v.copy(d).multiplyScalar(.098).add(HC);
          if(isFace(v)) continue;
          const m = mesh(spike, hm, v.x, v.y, v.z); m.scale.set(.017,.055,.012);
          const dir = d.clone().multiplyScalar(.55).add(new THREE.Vector3(0,-1,0)).normalize();
          m.quaternion.setFromUnitVectors(up, dir.negate());
          m.position.addScaledVector(dir, .03);
          g.add(m);
        }
      }
      [-1,0,1].forEach(i=>{ const n = ell(.025,.05,.014, hm, i*.03,.02,.088); n.rotation.z = i*.25; g.add(n); }); // ragged nape
    }
    return {g, pigs};
  }
  function setHair(rig, style){
    if(rig.hairG){ rig.head.remove(rig.hairG); rig.hairG.traverse(o=>{ if(o.geometry) o.geometry.dispose(); }); }
    const h = buildHair(style, rig.hairM);
    rig.head.add(h.g); rig.hairG = h.g; rig.pigs = h.pigs;
  }

  function decal(parent, mat, w, h, pos, rotY){
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
    m.position.set(...pos); m.rotation.y = rotY; m.renderOrder = 2; parent.add(m); return m;
  }

    for(let i=0;i<6;i++) blip(a, t + .04 + Math.random()*.3, 170 + Math.random()*220, 520 + Math.random()*500, .03 + Math.random()*.02, .18, panTo(a, (Math.random()-.5)*1.2, both));
    // 4. gravel raining down
    for(let i=0;i<16;i++){
      const ti = t + .07 + Math.pow(Math.random(), 1.6)*.42;
      burst(a, ti, .012, 'bandpass', 1700 + Math.random()*4800, 3, .05 + Math.random()*.11, .009, panTo(a, (Math.random()-.5)*1.4, both));
    }
    // 5. steam hiss
    sweep(a, t+.03, .45, 7000, 4200, .7, .1, .06, .5, both);
  }

  // low lava rumble with the odd gloop while playing on the lava stage
  let lavaAmb = null;
  function startLavaAmbient(){
    const a = audio(); if(!a || lavaAmb) return;
    const B = bus(a), n = a.createBufferSource(); n.buffer = B.nb; n.loop = true;
    const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 170;
    const g = a.createGain(); g.gain.value = 0; g.gain.linearRampToValueAtTime(.12, a.currentTime + 1);
    n.connect(f).connect(g).connect(a.destination); n.start();
    const tick = setInterval(()=>{ if(!fx.sound || !ac) return; const t = ac.currentTime; blip(ac, t, 90 + Math.random()*60, 210 + Math.random()*140, .07, .06, [ac.destination]); }, 700);
    lavaAmb = {n, g, tick};
  }
  function stopLavaAmbient(){
    if(!lavaAmb) return;
    try { lavaAmb.g.gain.linearRampToValueAtTime(0, ac.currentTime + .4); lavaAmb.n.stop(ac.currentTime + .45); } catch(e){}
    clearInterval(lavaAmb.tick); lavaAmb = null;
  }
  // ---------- break sounds for the new stages ----------
  function ping(a, t, f, dur, peak, out, type='sine'){
    const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t+.002); g.gain.exponentialRampToValueAtTime(.0005, t+dur);
    o.connect(g); out.forEach(d=> g.connect(d)); o.start(t); o.stop(t+dur+.02);
  }
  function iceBreak(){            // 쨍그랑: glassy crack, ringing ice, tinkling shards, cave echo
    const a = audio(); if(!a) return; const t = a.currentTime + .002;
    const {dry, verb} = bus(a), both = [dry, verb], k = .94 + Math.random()*.12;
    blip(a, t, 140*k, 60, .08, .45, [dry]);
    burst(a, t, .02, 'highpass', 4200*k, 0, 1, .012, both);
    burst(a, t+.012, .02, 'highpass', 3600*k, 0, .6, .01, both);
    [[2120,.36,.5],[3260,.3,.42],[4480,.24,.34],[5930,.18,.26],[7650,.12,.2]].forEach(([f,pk,d],i)=> ping(a, t+.002+i*.004, f*k*(1+(Math.random()-.5)*.02), d, pk, panTo(a, (i%2?.3:-.3), both)));
    for(let i=0;i<22;i++){ const ti = t + .03 + Math.pow(Math.random(), 1.4)*.55; ping(a, ti, 3000 + Math.random()*6500, .05 + Math.random()*.09, .04 + Math.random()*.07, panTo(a, (Math.random()-.5)*1.4, both)); }
    sweep(a, t+.01, .3, 9000, 5000, .8, .07, .01, .3, both);
  }
  function tileBreak(){           // 와장창: clay tiles cracking, shards clattering, the crowd cheering
    const a = audio(); if(!a) return; const t = a.currentTime + .002;
    const {dry, verb} = bus(a), both = [dry, verb], k = .94 + Math.random()*.12;
    blip(a, t, 120*k, 45, .12, .8, [dry]);
    burst(a, t, .06, 'lowpass', 500, 0, .35, .05, [dry]);
    [[0,1,-.2],[.022,.8,.25],[.044,.65,-.1]].forEach(([dt, amp, pan])=>{   // one crack per tile
      const out = panTo(a, pan, both), ti = t + dt;
      burst(a, ti, .022, 'highpass', 2600*k, 0, .95*amp, .012, out);
      [[880,.4,7,.08],[1430,.34,8,.07],[2290,.26,8,.06],[3480,.18,9,.045]].forEach(([f,lv,q,ring])=> burst(a, ti+.0006, ring+.02, 'bandpass', f*k*(1+dt*2), q, lv*amp, ring, out));
    });
    for(let i=0;i<14;i++){ const ti = t + .07 + Math.pow(Math.random(), 1.3)*.38; burst(a, ti, .014, 'bandpass', 1400 + Math.random()*3800, 3.5, .06 + Math.random()*.12, .011, panTo(a, (Math.random()-.5)*1.4, both)); }
    // crowd "와아"
    const cheer = (f, pk, pan)=>{ const B = bus(a), n = a.createBufferSource(); n.buffer = B.nb; n.loop = true;
      const fl = a.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = f; fl.Q.value = .8;
      const g = a.createGain(); g.gain.setValueAtTime(0, t+.08); g.gain.linearRampToValueAtTime(pk, t+.3); g.gain.exponentialRampToValueAtTime(.0005, t+1.3);
      n.connect(fl).connect(g); panTo(a, pan, both).forEach(o=> g.connect(o)); n.start(t+.08); n.stop(t+1.35); };
    cheer(720, .3, -.5); cheer(1150, .22, .5); cheer(1900, .09, 0);
  }
  function zapBreak(){            // 파직: electric arc, crystal shatter, a crack of thunder
    const a = audio(); if(!a) return; const t = a.currentTime + .002;
    const {dry, verb} = bus(a), both = [dry, verb];
    for(let v=0; v<2; v++){
      const o = a.createOscillator(), g = a.createGain(), hp = a.createBiquadFilter(); o.type = 'sawtooth'; hp.type = 'highpass'; hp.frequency.value = 500;
      for(let s=0; s<30; s++) o.frequency.setValueAtTime(70 + Math.random()*260, t + s*.009);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.22, t+.004); g.gain.exponentialRampToValueAtTime(.0005, t+.3);
      o.connect(hp).connect(g); panTo(a, v ? .35 : -.35, both).forEach(d=> g.connect(d)); o.start(t); o.stop(t+.32);
    }
    burst(a, t, .02, 'highpass', 3800, 0, 1, .012, both);
    for(let i=0;i<26;i++){ const ti = t + Math.pow(Math.random(), 1.5)*.32; burst(a, ti, .006, 'highpass', 3000 + Math.random()*4000, 0, .1 + Math.random()*.18, .005, panTo(a, (Math.random()-.5)*1.4, both)); }
    [[1760,.16,.3],[2640,.12,.24],[3960,.09,.18]].forEach(([f,pk,d])=> ping(a, t+.004, f, d, pk, both));
    thunder(.6, t + .04);
  }
  function thunder(level=.6, at){
    const a = audio(); if(!a) return; const t = (at || a.currentTime) + .002, {dry, verb} = bus(a);
    const B = bus(a), n = a.createBufferSource(); n.buffer = B.nb; n.loop = true;
    const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(900, t); lp.frequency.exponentialRampToValueAtTime(140, t+.6);
    const g = a.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(level*.6, t+.03); g.gain.setTargetAtTime(.0005, t+.25, .35);
    n.connect(lp).connect(g); g.connect(dry); g.connect(verb); n.start(t); n.stop(t+1.65);
    blip(a, t, 70, 28, .5, level*.7, [dry]);
  }
  function seaBreak(){            // underwater: muffled crack and thud, then a rush of bubbles
    const a = audio(); if(!a) return; const t = a.currentTime + .002;
    const {dry, verb} = bus(a);
    const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1100; lp.Q.value = .7; lp.connect(dry); lp.connect(verb);
    blip(a, t, 110, 40, .2, .9, [lp]);
    burst(a, t, .04, 'highpass', 1500, 0, .9, .03, [lp]);
    [[520,.4,8,.12],[860,.32,9,.1],[1300,.24,10,.08]].forEach(([f,lv,q,ring])=> burst(a, t+.001, ring+.03, 'bandpass', f, q, lv, ring, [lp]));
    burst(a, t+.025, .04, 'highpass', 1300, 0, .5, .03, [lp]);
    for(let i=0;i<14;i++){ const ti = t + .05 + i*.035 + Math.random()*.03; blip(a, ti, 260 + Math.random()*260, 700 + Math.random()*800, .035 + Math.random()*.03, .14, panTo(a, (Math.random()-.5)*1.2, [dry, verb])); }
  }
  const SND = {dojo:()=>crack(), lava:()=>lavaBreak(), ice:iceBreak, palace:tileBreak, storm:zapBreak, sea:seaBreak};

  // ---------- ambience per stage (while playing) ----------
  let amb = null;
  function loopNoise(a, type, freq, q, gain){
    const B = bus(a), n = a.createBufferSource(); n.buffer = B.nb; n.loop = true;
    const f = a.createBiquadFilter(); f.type = type; f.frequency.value = freq; if(q) f.Q.value = q;
    const g = a.createGain(); g.gain.value = 0; g.gain.linearRampToValueAtTime(gain, a.currentTime + 1);
    n.connect(f).connect(g).connect(a.destination); n.start(); return {n, g, f};
  }
  function startAmbient(stage){
    stopAmbient();
    if(stage === 'lava'){ startLavaAmbient(); return; }
    const a = audio(); if(!a) return;
    const loops = [], timers = [];
    if(stage === 'ice'){
      const w = loopNoise(a, 'bandpass', 500, .6, .05); loops.push(w);
      const lfo = a.createOscillator(), lg = a.createGain(); lfo.frequency.value = .13; lg.gain.value = 280; lfo.connect(lg).connect(w.f.frequency); lfo.start(); loops.push({n:lfo, g:lg});
      timers.push(setInterval(()=>{ if(fx.sound && ac && Math.random() < .5) ping(ac, ac.currentTime, 3500 + Math.random()*4000, .3, .02, [bus(ac).verb]); }, 900));
    } else if(stage === 'palace'){
      loops.push(loopNoise(a, 'bandpass', 700, .5, .025));
      timers.push(setInterval(()=>{ if(!fx.sound || !ac || Math.random() < .5) return; const t = ac.currentTime; for(let i=0;i<3;i++) blip(ac, t + i*.09, 2600 + Math.random()*500, 3600 + Math.random()*600, .05, .03, [ac.destination]); }, 2200));   // birds
    } else if(stage === 'storm'){
      loops.push(loopNoise(a, 'highpass', 2400, 0, .045));   // rain
      loops.push(loopNoise(a, 'lowpass', 260, 0, .05));      // wind
    } else if(stage === 'sea'){
      loops.push(loopNoise(a, 'lowpass', 300, 0, .09));
      timers.push(setInterval(()=>{ if(!fx.sound || !ac) return; const t = ac.currentTime; blip(ac, t, 300 + Math.random()*300, 900 + Math.random()*600, .04, .04, [ac.destination]); }, 600));
    }
    amb = {loops, timers};
  }
  function stopAmbient(){
    stopLavaAmbient();
    if(!amb) return;
    amb.loops.forEach(l=>{ try { if(l.g.gain.linearRampToValueAtTime) l.g.gain.linearRampToValueAtTime(0, ac.currentTime + .4); l.n.stop(ac.currentTime + .45); } catch(e){} });
    amb.timers.forEach(clearInterval); amb = null;
  }
  function buzz(){
    const a = audio(); if(!a) return; const t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain(); o.type='square';
    o.frequency.setValueAtTime(120,t); o.frequency.linearRampToValueAtTime(80,t+.2);
    g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(.001,t+.24);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+.25);
  }
  function chime(notes){
    const a = audio(); if(!a) return; const t = a.currentTime;
    notes.forEach((f,i)=>{ const o=a.createOscillator(), g=a.createGain(); o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(0,t+i*.08); g.gain.linearRampToValueAtTime(.2,t+i*.08+.02); g.gain.exponentialRampToValueAtTime(.001,t+i*.08+.3);
      o.connect(g).connect(a.destination); o.start(t+i*.08); o.stop(t+i*.08+.35); });
  }
  function tick(hi){
    const a = audio(); if(!a) return; const t=a.currentTime; const o=a.createOscillator(), g=a.createGain();
    o.frequency.value = hi?880:440; g.gain.setValueAtTime(.15,t); g.gain.exponentialRampToValueAtTime(.001,t+.12);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+.13);
  }
  function vib(p){ if(!fx.vib) return; try{ navigator.vibrate && navigator.vibrate(p) }catch(e){} }
  function shake(a){ if(fx.shake) shakeAmt = Math.max(shakeAmt, a); }
  function flashRed(){ $('flash').animate([{opacity:1},{opacity:0}],{duration:350}); }
  function screenOf(v3){ const v = v3.clone().project(camera); return [(v.x+1)/2*W, (1-v.y)/2*H]; }
  function popText(html, v3, bad){
    const [x,y] = screenOf(v3);
    const p = document.createElement('div'); p.className = 'pop' + (bad?' bad':''); p.innerHTML = html;
    p.style.left = x+'px'; p.style.top = y+'px'; $('pops').appendChild(p);
    p.animate([{transform:'translate(-50%,-50%) scale(.6)',opacity:1},{transform:'translate(-50%,-130%) scale(1.1)',opacity:1,offset:.3},{transform:'translate(-50%,-210%) scale(1)',opacity:0}],{duration:720,easing:'ease-out'}).onfinish = ()=>p.remove();
  }
  function banner(txt){ const el = $('lvl'); el.textContent = txt; el.animate([{opacity:0,transform:'translate(-50%,-30%) scale(.8)'},{opacity:1,transform:'translate(-50%,-50%) scale(1)',offset:.2},{opacity:1,offset:.75},{opacity:0,transform:'translate(-50%,-70%)'}],{duration:1100,easing:'ease-out'}); }

  // ================= GAME FLOW =================
  let st = {score:0, combo:0, maxCombo:0, lives:5, broken:0, t0:0, elapsed:0};
  let cur = null, running = false, token = 0, last = [];
  const fmt = ms => { const s = Math.floor(ms/1000); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
  function getBest(){ try { return +localStorage.getItem('tkd-break-best-endless') || 0 } catch(e){ return 0 } }
  function setBest(v){ try { localStorage.setItem('tkd-break-best-endless', String(v)) } catch(e){} }
  $('bestText').textContent = '최고 기록 ' + getBest().toLocaleString() + '점';

  function hud(){
    $('hScore').textContent = st.score.toLocaleString();
    $('hCombo').textContent = st.combo;
    $('hComboWrap').classList.toggle('hot', st.combo >= 10);
    $('hLifeN').textContent = st.lives;
    $('hLives').classList.toggle('low', st.lives <= 2);
    const lv = levelOf(st.broken);
    $('lvlText').textContent = 'Lv.' + lv + (lv === MAX_LV ? ' (최고)' : '') + ' · ' + (limitFor(st.broken)/1000).toFixed(2) + '초';
    $('lvlBar').style.width = (lv === MAX_LV ? 100 : (st.broken % PER_LEVEL) / PER_LEVEL * 100) + '%';
    $('boardText').textContent = '격파 ' + st.broken + '장';
  }

  function newGame(){
    const my = ++token; running = false; cur = null;
    boards.slice().forEach(removeBoard);
    st = {score:0, combo:0, maxCombo:0, lives:5, broken:0, t0:0, elapsed:0};
    hud(); $('hTime').textContent = '0:00';
    $('timerBar').style.transform = 'scaleX(1)';
    $('ovIntro').hidden = false; orbitDemo = false; setView(viewIdx);
    let n = 3;
    const step = () => {
      if(my !== token) return;
      if(n > 0){ $('introCount').textContent = n; tick(false); n--; setTimeout(step, 650); }
      else { $('introCount').textContent = '시작!'; tick(true);
        setTimeout(()=>{ if(my!==token) return; $('ovIntro').hidden = true; running = true; st.t0 = performance.now(); last = []; startAmbient(look.stage); spawn(); }, 350); }
    };
    step();
  }

  function pickDir(){
    let d;
    do { d = DIRS[Math.floor(Math.random()*4)] }
    while (last.length >= 2 && last[last.length-1] === d && last[last.length-2] === d);
    last.push(d); if(last.length > 4) last.shift();
    return d;
  }
  function spawn(){
    if(!running) return;
    const dir = pickDir();
    cur = {dir, bd: makeBoard(dir), start: performance.now(), limit: limitFor(st.broken)};
  }

  function hit(dir){
    if(!running || !cur) return;
    kick(dir); whoosh();
    if(look.stage === 'sea') setTimeout(()=> breathe(14, 1.2, true), 60);   // exhale with the kick
    if(dir !== cur.dir){ fail('반대쪽!'); return; }
    const el = performance.now() - cur.start;
    const speed = Math.max(0, 1 - el / cur.limit);
    const lv = levelOf(st.broken);
    const pts = (100 + Math.round(speed*100) + Math.min(st.combo, 40) * 10) * (1 + (lv-1)*.1) | 0;
    st.score += pts; st.combo++; st.maxCombo = Math.max(st.maxCombo, st.combo); st.broken++;
    const bd = cur.bd; cur = null;
    const where = bd.g.position.clone().setY(BOARD_H + .38);
    // combo bonus: 10 in a row = +1, 11 = +2, 12 = +3 ...
    const comboGain = st.combo >= 10 ? st.combo - 9 : 0;
    st.lives += comboGain;
    const lifeTag = comboGain ? '<span class="life">' + st.combo + '콤보 · 기회 +' + comboGain + '</span>' : '';
    setTimeout(()=>{ breakBoard(bd); (SND[look.stage] || crack)(); vib(25); shake(.05); popText((speed > .55 ? '얍! ' : '') + '+' + pts + '<small>' + KICK_NAME[dir] + '</small>' + lifeTag, where); if(comboGain) chime([784,1047]); if(look.stage === 'palace') crowdCheer(); }, 95*kickSlow());
    // passing a level = +3 chances
    if(st.broken % PER_LEVEL === 0 && lv < MAX_LV){
      st.lives += 3;
      const nl = lv + 1;
      setTimeout(()=>{ banner('Lv.' + nl + ' 통과 보너스 · 기회 +3'); chime([523,659,784,1047]); vib([40,30,80]); }, 140);
    }
    hud();
    const my = token;
    setTimeout(()=>{ if(my===token) spawn() }, 110);
  }

  // timeout = game over at once; wrong direction = lose one chance
  let endCause = '';
  function fail(msg, fatal){
    if(!cur) return;
    const bd = cur.bd; cur = null;
    st.combo = 0;
    if(fatal){ st.lives = 0; endCause = look.stage === 'lava' ? '용암 바위를 놓쳤습니다.' : '판자를 놓쳤습니다.'; }
    else { st.lives--; endCause = '기회를 모두 잃었습니다.'; }
    popText(msg, bd.g.position.clone().setY(BOARD_H + .38), true);
    failBoard(bd);
    buzz(); vib([60,40,60]); shake(.18); flashRed();
    hud();
    const my = token;
    if(st.lives <= 0){ running = false; setTimeout(()=>{ if(my===token) endGame() }, fatal ? 450 : 750); return; }
    setTimeout(()=>{ if(my===token && running) spawn() }, 320);
  }

  function endGame(){
    running = false; cur = null; orbitDemo = true; stopAmbient();
    const best = getBest(), isNew = st.score > best;
    if(isNew) setBest(st.score);
    $('endTitle').textContent = isNew ? '새 최고 기록!' : '경기 종료';
    const lv = levelOf(st.broken);
    $('endDesc').textContent = endCause + ' Lv.' + lv + '까지 버텼습니다. 판자 한 장당 평균 ' + (st.broken ? Math.round(st.elapsed/st.broken) : 0) + 'ms.';
    $('rScore').textContent = st.score.toLocaleString();
    $('rTime').textContent = fmt(st.elapsed);
    $('rBoards').textContent = st.broken;
    $('rCombo').textContent = st.maxCombo;
    const b = Math.max(best, st.score);
    $('endBest').textContent = isNew ? '이전 최고 ' + best.toLocaleString() + '점' : '최고 기록 ' + b.toLocaleString() + '점';
    $('bestText').textContent = '최고 기록 ' + b.toLocaleString() + '점';
    $('ovEnd').hidden = false;
  }

  // ================= MAIN LOOP =================
  let prev = performance.now();
  function frame(now){
    const dt = Math.min(.05, (now - prev)/1000); prev = now;
    if(running){
      st.elapsed = now - st.t0;
      $('hTime').textContent = fmt(st.elapsed);
      if(cur){
        const r = (now - cur.start) / cur.limit;
        const bar = $('timerBar');
        bar.style.transform = 'scaleX(' + Math.max(0, 1 - r) + ')';
        bar.style.background = r > .7 ? 'var(--bad)' : 'var(--gold)';
        cur.bd.mat.emissiveIntensity = (cur.bd.baseGlow || 0) + Math.max(0, r - .45) * (cur.bd.warnK || (cur.bd.kind === 'rock' ? 2.4 : .9));
        if(r >= 1) fail('놓쳤다!', true);
      }
    }
    boards.forEach(bd=>{
      bd.g.scale.setScalar(.2 + .8*sstep(Math.min(1, (now - bd.born)/110)));
      bd.g.position.y = BOARD_H + Math.sin(now*.006 + bd.born)*.008;
      if(bd.spin) bd.spin.rotation.y = now*.0025;
    });
    for(let i=debris.length-1;i>=0;i--){
      const d = debris[i];
      d.v.y -= d.grav*dt; if(d.drag) d.v.multiplyScalar(Math.max(0, 1 - d.drag*dt));
      d.m.position.addScaledVector(d.v, dt);
      if(d.wob !== undefined){ d.wob += dt*9; d.m.position.x += Math.sin(d.wob)*dt*.05; const sc = 1 + Math.sin(d.wob*1.3)*.12; d.m.scale.set(sc, 2 - sc, sc); }
      if(d.grav > 0 && d.m.position.y < .03){ d.m.position.y = .03; d.v.y *= -.3; d.v.x *= .6; d.v.z *= .6; d.w.multiplyScalar(.6); }
      d.m.rotation.x += d.w.x*dt; d.m.rotation.y += d.w.y*dt; d.m.rotation.z += d.w.z*dt;
      d.life -= dt;
      if(d.life < .4) d.m.material.opacity = Math.max(0, d.life/.4);
      if(d.life <= 0){ scene.remove(d.m); d.m.material.dispose(); if(d.m.geometry && !SHARED_GEO.has(d.m.geometry)) d.m.geometry.dispose(); debris.splice(i,1); }
    }
    for(let i=rings.length-1;i>=0;i--){
      const r = rings[i]; r.t += dt/(r.slow ? .9 : .3);
      r.m.scale.setScalar(.6 + r.t*2.6); r.m.material.opacity = 1 - r.t;
      if(r.t >= 1){ scene.remove(r.m); r.m.material.dispose(); rings.splice(i,1); }
    }
    updateLava(dt, now);
    updateStages(dt, now);
    updateCrowd(dt, now); updatePuffs(dt);
    if(look.stage === 'sea'){ breathT -= dt; if(breathT <= 0){ breathe(6, .7, running); breathT = 2.4 + Math.random()*1.2; } }
    pose(now);
    updateCamera(dt);
    renderer.render(scene, camera);
    if(!$('ovStart').hidden) renderPreview(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ================= INPUT =================
  document.querySelectorAll('.btn').forEach(b=>{
    const d = b.dataset.dir;
    b.addEventListener('pointerdown', e=>{ e.preventDefault(); onInput(d); });
    b.addEventListener('click', e=>{ if(e.detail === 0) onInput(d); });
  });
  const KEYS = {ArrowUp:'F',KeyW:'F',ArrowDown:'B',KeyS:'B',ArrowLeft:'L',KeyA:'L',ArrowRight:'R',KeyD:'R'};
  window.addEventListener('keydown', e=>{
    const d = KEYS[e.code];
    if(d){ e.preventDefault(); if(e.repeat) return; onInput(d); const b=$('b'+d); b.classList.add('down'); setTimeout(()=>b.classList.remove('down'),90); return; }
    if((e.code==='Space'||e.code==='Enter') && !$('ovStart').hidden){ e.preventDefault(); begin(); }
    else if((e.code==='Space'||e.code==='Enter') && !$('ovEnd').hidden){ e.preventDefault(); again(); }
    else if(e.code==='KeyV'){ setView((viewIdx+1)%VIEWS.length); }
  });

  let rotateMode = false; const ptr = {};
  function swipeMark(x, y, dir){
    const s = document.createElement('div'); s.className = 'swipe'; s.style.left = x+'px'; s.style.top = y+'px'; $('pops').appendChild(s);
    const [dx,dz] = DIRV[dir];
    s.animate([{opacity:.9, transform:'translate(-50%,-50%) scale(.5)'},{opacity:0, transform:`translate(calc(-50% + ${dx*50}px), calc(-50% + ${dz*50}px)) scale(1.3)`}],{duration:280,easing:'ease-out'}).onfinish=()=>s.remove();
  }
  canvas.addEventListener('contextmenu', e=>e.preventDefault());
  canvas.addEventListener('pointerdown', e=>{
    try{ canvas.setPointerCapture(e.pointerId) }catch(_){}
    ptr[e.pointerId] = {x:e.clientX, y:e.clientY, lastDir:null, rot: rotateMode || e.button === 2 || !running};
  });
  canvas.addEventListener('pointermove', e=>{
    const p = ptr[e.pointerId]; if(!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    if(p.rot){
      if(orbitDemo) return;
      camTgt.yaw -= dx*.008; camTgt.pitch = Math.max(.05, Math.min(1.4, camTgt.pitch + dy*.006));
      camCur.yaw = camTgt.yaw; camCur.pitch = camTgt.pitch;
      p.x = e.clientX; p.y = e.clientY; return;
    }
    if(Math.hypot(dx,dy) < 26) return;
    const dir = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'L' : 'R') : (dy < 0 ? 'F' : 'B');
    if(dir === p.lastDir){ p.x = e.clientX; p.y = e.clientY; return; }
    p.lastDir = dir; p.x = e.clientX; p.y = e.clientY;
    if(running){ swipeMark(e.clientX, e.clientY, dir); onInput(dir); }
  });
  const up = e=>{ delete ptr[e.pointerId]; };
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', e=>{ e.preventDefault(); userZoom = Math.max(.6, Math.min(1.8, userZoom * (e.deltaY > 0 ? 1.08 : .92))); }, {passive:false});

  $('viewBtn').addEventListener('click', ()=> setView((viewIdx+1)%VIEWS.length));
  // start-screen view picker: 왼쪽 비스듬히 / 오른쪽 비스듬히 / 위쪽 / 직접 선택 — preview shows the chosen angle
  function chooseView(i){
    viewIdx = i; pvMode = 'view'; syncViewPicker();
    $('viewBtn').textContent = '시점: ' + VIEWS[i].name;
    try { localStorage.setItem('tkd-view', String(i)) } catch(e){}
  }
  document.querySelectorAll('.vw').forEach(b=> b.addEventListener('click', ()=> chooseView(+b.dataset.view)));
  // 직접 선택: drag the preview to turn the camera, wheel or two fingers to zoom
  const pvPtr = new Map(); let pinch0 = 0;
  function saveCustom(){ const c = VIEWS[CUSTOM]; try { localStorage.setItem('tkd-view-custom', JSON.stringify({yaw:c.yaw, pitch:c.pitch, dist:c.dist})) } catch(e){} }
  function toCustom(){
    if(viewIdx !== CUSTOM){ const v = VIEWS[viewIdx], c = VIEWS[CUSTOM];
      if(pvMode === 'orbit'){ c.yaw = -pvYaw + Math.PI; c.pitch = .3; c.dist = 5.8; } else { c.yaw = v.yaw; c.pitch = v.pitch; c.dist = v.dist; }
      chooseView(CUSTOM); }
  }
  pvCanvas.addEventListener('pointerdown', e=>{ try{ pvCanvas.setPointerCapture(e.pointerId) }catch(_){} pvPtr.set(e.pointerId, {x:e.clientX, y:e.clientY}); toCustom();
    if(pvPtr.size === 2){ const [a,b] = [...pvPtr.values()]; pinch0 = Math.hypot(a.x-b.x, a.y-b.y); } });
  pvCanvas.addEventListener('pointermove', e=>{
    const p = pvPtr.get(e.pointerId); if(!p) return;
    const c = VIEWS[CUSTOM];
    if(pvPtr.size === 1){
      c.yaw -= (e.clientX - p.x) * .012;
      c.pitch = Math.max(.05, Math.min(1.45, c.pitch + (e.clientY - p.y) * .008));
    }
    p.x = e.clientX; p.y = e.clientY;
    if(pvPtr.size === 2){ const [a,b] = [...pvPtr.values()]; const dd = Math.hypot(a.x-b.x, a.y-b.y);
      if(pinch0){ c.dist = Math.max(3.2, Math.min(10, c.dist * pinch0 / dd)); } pinch0 = dd; }
    saveCustom();
  });
  const pvUp = e=>{ pvPtr.delete(e.pointerId); pinch0 = 0; };
  pvCanvas.addEventListener('pointerup', pvUp); pvCanvas.addEventListener('pointercancel', pvUp);
  pvCanvas.addEventListener('wheel', e=>{ e.preventDefault(); toCustom(); const c = VIEWS[CUSTOM]; c.dist = Math.max(3.2, Math.min(10, c.dist * (e.deltaY > 0 ? 1.08 : .92))); saveCustom(); }, {passive:false});
  syncViewPicker();
  $('viewBtn').textContent = '시점: ' + VIEWS[viewIdx].name;
  $('modeBtn').addEventListener('click', ()=>{
    rotateMode = !rotateMode;
    $('modeBtn').setAttribute('aria-pressed', String(rotateMode));
    $('modeBtn').textContent = rotateMode ? '드래그: 시점 회전' : '드래그: 발차기';
    $('hint').textContent = rotateMode ? '드래그해서 선수를 돌려 보세요' : '판자 쪽으로 드래그하면 발차기';
    canvas.classList.toggle('rot', rotateMode);
  });
  function bindToggle(id, k){ const b = $(id); b.addEventListener('click', ()=>{ fx[k] = !fx[k]; b.setAttribute('aria-pressed', String(fx[k])); }); }
  bindToggle('tgSound','sound'); bindToggle('tgVib','vib'); bindToggle('tgShake','shake');

  function begin(){ audio(); $('ovStart').hidden = true; newGame(); }
  function again(){ $('ovEnd').hidden = true; newGame(); }
  $('startBtn').addEventListener('click', begin);
  $('againBtn').addEventListener('click', again);
  $('changeBtn').addEventListener('click', ()=>{ $('ovEnd').hidden = true; $('ovStart').hidden = false; });
  document.querySelectorAll('.pick').forEach(b=> b.addEventListener('click', ()=>{
    look.kind = b.dataset.kind;
    if(!look.hairPicked) look.hair = look.kind === 'f' ? 'pony' : 'short';
    pvMode = 'orbit'; applyLook(); makeThumbs();
  }));
  document.querySelectorAll('.sw[data-dobok]').forEach(b=> b.addEventListener('click', ()=>{ look.dobok = b.dataset.dobok; pvMode = 'orbit'; applyLook(); makeThumbs(); }));
  document.querySelectorAll('.sw[data-stage]').forEach(b=> b.addEventListener('click', ()=>{
    look.stage = b.dataset.stage; applyLook();
    boards.slice().forEach(removeBoard); makeBoard('L');     // sample target matches the stage
  }));
  applyLook(); makeThumbs();

  hud();
  makeBoard('L');
})();
</script>
</body>
</html>
